name: Сообщить об ошибке
description: Воспроизводимая проблема в StabiLink Desktop
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте токены, QR-коды, ключи, подписочные ссылки и необработанные логи.
  - type: input
    id: version
    attributes:
      label: Версия StabiLink
      placeholder: "4.2.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Версия Windows
      options:
        - Windows 11
        - Windows 10
        - Другая
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Связанный модуль
      options:
        - Интерфейс или запуск
        - Оптимизатор / Phantom
        - Игровой профиль / каталог стратегий
        - Game Filter
        - Performance Hub
        - SecureLink VPN
        - TurboDNS
        - Обновление
        - Авторизация
        - Другое
    validations:
      required: true
  - type: input
    id: game_strategy
    attributes:
      label: Игра или сервис и выбранная стратегия
      placeholder: "WARDOGS — Phantom (WARDOGS ALT)"
  - type: input
    id: failure_time
    attributes:
      label: Время сбоя и включённые модули
      description: Укажите часовой пояс и состояние Оптимизатора, SecureLink, TurboDNS.
      placeholder: "30.09.2026 20:15 МСК; Оптимизатор включён, SecureLink выключен"
  - type: textarea
    id: comparison
    attributes:
      label: Результат сравнения подключения
      description: Вход, лобби, матч или голосовой чат; что происходит без Оптимизатора и с другим профилем?
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Что вы нажали и что произошло?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Дополнительная информация
      description: Прикладывайте только скриншоты и заранее очищенные фрагменты журналов.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Я удалил токены, ключи, QR-коды, ссылки подписки и личные данные.
          required: true
